<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aprovação de Compras · Dynamics</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icone_dynamics_512.png">
<link rel="apple-touch-icon" href="icone_dynamics_512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Compras Dynamics">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;padding:0;height:100%;background:#15181D;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:#15181D;color:#8A95A3;
    font:400 13px/1.5 system-ui,sans-serif;z-index:2;transition:opacity .4s}
  .espera img{width:72px;height:72px;border-radius:16px}
  .espera .giro{width:20px;height:20px;border:2px solid #2C333C;border-top-color:#D0121C;
    border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .some{opacity:0;pointer-events:none}
  .sino{position:fixed;right:14px;bottom:14px;z-index:5;background:#D0121C;color:#fff;
    border:0;border-radius:99px;padding:12px 18px;cursor:pointer;display:none;
    font:600 13px/1 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .sino.aparece{display:block}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <div class="espera" id="espera">
    <img src="icone_dynamics_512.png" alt="">
    <div class="giro"></div>
    <div>Abrindo a Aprovação de Compras…</div>
  </div>

  <button class="sino" id="sino">Ativar notificações</button>

  <!-- A URL /exec vai no src abaixo. O app roda aqui dentro, sem a faixa do Google. -->
  <iframe id="app"
          src="COLE_AQUI_A_URL_EXEC"
          allow="clipboard-write; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* O aplicativo roda dentro do iframe e avisa quantos pedidos estao na fila.
     Só a pagina de fora pode marcar o icone do sistema operacional. */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.tipo !== 'badge') return;
    try{
      if(navigator.setAppBadge){
        if(d.n > 0) navigator.setAppBadge(d.n); else navigator.clearAppBadge();
      }
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.controller.postMessage(d);
      }
      document.title = (d.n > 0 ? '(' + d.n + ') ' : '') + 'Aprovação de Compras · Dynamics';
    }catch(e){ /* navegador sem suporte */ }
  });

  /* Registra o service worker. Ele nao guarda dado do sistema — serve para
     o Chrome oferecer "Instalar aplicativo", que e o que habilita o numero
     sobre o icone no Android e no PC. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.log('service worker nao registrado:', e);
      });
    });
  }

  /* ---------------- notificacoes ----------------
     COLE ABAIXO o App ID do OneSignal (o de 36 caracteres com tracos).
     Vazio, o aplicativo funciona igual, so sem notificacao. */
  var ONESIGNAL_APP_ID = 'COLE_AQUI_O_APP_ID';

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  if (ONESIGNAL_APP_ID.indexOf('COLE_AQUI') !== 0) {
    OneSignalDeferred.push(function(OneSignal){
      OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        /* usa o NOSSO service worker, que ja carrega o do OneSignal por dentro */
        serviceWorkerPath: 'sw.js',
        serviceWorkerParam: { scope: './' },
        allowLocalhostAsSecureOrigin: false
      }).then(function(){
        var sino = document.getElementById('sino');
        var jaPode = OneSignal.Notifications.permission;
        var suportado = OneSignal.Notifications.isPushSupported();
        /* O iPhone so expoe a permissao quando o app foi aberto pelo icone
           da Tela de Inicio. Na aba do Safari o botao nem aparece. */
        if (suportado && !jaPode) { sino.classList.add('aparece'); }
        sino.addEventListener('click', function(){
          OneSignal.Notifications.requestPermission().then(function(){
            sino.classList.remove('aparece');
          });
        });
      });
    });
  }

  var quadro = document.getElementById('app');
  var espera = document.getElementById('espera');

  quadro.addEventListener('load', function(){
    espera.classList.add('some');
    setTimeout(function(){ espera.style.display = 'none'; }, 500);
  });

  /* Se a URL não foi trocada, avisa em vez de deixar tela preta. */
  if (quadro.getAttribute('src').indexOf('COLE_AQUI') === 0) {
    espera.innerHTML = '<div style="max-width:420px;text-align:center;padding:24px;color:#C7D0DA">'
      + '<b>Falta configurar a URL.</b><br><br>'
      + 'Edite o index.html no GitHub e substitua COLE_AQUI_A_URL_EXEC '
      + 'pela URL /exec da implantação.</div>';
  }

  /* Rede lenta: em 20 segundos ainda sem carregar, oferece o caminho direto. */
  setTimeout(function(){
    if (espera.style.display !== 'none' && quadro.getAttribute('src').indexOf('COLE_AQUI') !== 0) {
      espera.innerHTML = '<div style="max-width:420px;text-align:center;padding:24px;color:#C7D0DA">'
        + 'Está demorando mais que o normal.<br><br>'
        + '<a href="' + quadro.getAttribute('src') + '" style="color:#D0121C">Abrir direto</a></div>';
    }
  }, 20000);
</script>
</body>
</html>
